<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Forgot Password — CrowdScout</title>
  <meta name="theme-color" content="#111312"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="lib/supabase-client.js"></script>
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px">

<div style="width:100%;max-width:400px">

  <div style="text-align:center;margin-bottom:28px">
    <a href="landing.html">
      <img src="https://raw.githubusercontent.com/Elixtion/elixtion.github.io/refs/heads/main/images/Untitled%20design%20(3).png"
           alt="CrowdScout" style="height:52px;width:52px;border-radius:12px;margin-bottom:12px"/>
    </a>
    <h1 style="font-size:1.4rem;font-weight:800;margin:0 0 4px">Reset Your Password</h1>
    <p style="color:var(--surface-500);font-size:0.875rem;margin:0">We'll email you a link to set a new one.</p>
  </div>

  <div class="cs-card" id="formPane">
    <div class="cs-field">
      <label class="cs-label">Email</label>
      <input id="email" type="email" class="cs-input" placeholder="you@example.com"
             autocomplete="email" onkeydown="if(event.key==='Enter')handleReset()"/>
    </div>
    <div id="errMsg" style="font-size:0.8rem;color:#f87171;margin-bottom:8px;display:none"></div>
    <button class="cs-btn cs-btn-primary" style="width:100%;margin-bottom:10px" id="resetBtn" onclick="handleReset()">
      Send Reset Link
    </button>
    <div style="text-align:center;font-size:0.8rem;color:var(--surface-500)">
      Remembered it?
      <a href="login.html" style="color:var(--primary-500);font-weight:600;text-decoration:none">Sign in</a>
    </div>
  </div>

  <!-- Sent confirmation -->
  <div class="cs-card" id="sentPane" style="display:none;text-align:center">
    <span class="material-symbols-outlined" style="font-size:44px;color:var(--primary-500);display:block;margin-bottom:10px">mark_email_read</span>
    <div style="font-weight:700;font-size:1.05rem;margin-bottom:6px">Check your inbox</div>
    <p style="font-size:0.85rem;color:var(--surface-500);margin:0 0 14px">
      If an account exists for <strong id="sentTo" style="color:var(--surface-700)"></strong>,
      a password reset link is on its way. It may take a minute — check spam too.
    </p>
    <a href="login.html" class="cs-btn cs-btn-secondary" style="width:100%;text-decoration:none">Back to Sign In</a>
  </div>

  <div style="text-align:center;margin-top:16px">
    <a href="landing.html" style="font-size:0.8rem;color:var(--surface-400)">← Back to home</a>
  </div>

</div>

<div id="cs-toast-container"></div>

<script>
async function handleReset() {
  const email = document.getElementById("email").value.trim();
  if (!email) { showErr("Enter your email address."); return; }

  const btn = document.getElementById("resetBtn");
  btn.disabled = true;
  btn.textContent = "Sending…";
  document.getElementById("errMsg").style.display = "none";

  const { error } = await window.CS.auth.sendPasswordReset(email);

  btn.disabled = false;
  btn.textContent = "Send Reset Link";

  // Rate limit errors are worth surfacing; "user not found" is intentionally
  // not revealed (Supabase already answers 200 for unknown emails).
  if (error) { showErr(window.CS.auth.friendlyError(error.message)); return; }

  document.getElementById("sentTo").textContent = email;
  document.getElementById("formPane").style.display = "none";
  document.getElementById("sentPane").style.display = "";
}

function showErr(msg) {
  const el = document.getElementById("errMsg");
  el.textContent = msg;
  el.style.display = "";
}
</script>
</body>
</html>
