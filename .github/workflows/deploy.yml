# Builds the Eleventy site and publishes it to GitHub Pages.
# Requires: Settings > Pages > Source = "GitHub Actions".
name: Build and deploy site

on:
  push:
    branches: [tr]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Resized photos and downloaded originals are kept between builds.
      - uses: actions/cache@v4
        with:
          path: |
            .cache
            _site/img
          key: photos-${{ github.run_id }}
          restore-keys: photos-
      - name: Download official logos (falls back to the brand site if this fails)
        run: npm run fetch-brand
        continue-on-error: true
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
