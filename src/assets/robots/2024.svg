  <path class="r-o r-al" d="M96 230 L120 128 L150 128 L132 230 Z"/>
  <path class="r-o r-al" d="M324 230 L300 128 L270 128 L288 230 Z"/>
  <circle cx="122" cy="150" r="4" fill="#0B0E0C"/><circle cx="116" cy="190" r="4" fill="#0B0E0C"/>
  <circle cx="298" cy="150" r="4" fill="#0B0E0C"/><circle cx="304" cy="190" r="4" fill="#0B0E0C"/>
  <!-- the note -->
  <ellipse cx="210" cy="168" rx="62" ry="52" fill="none" stroke="#0B0E0C" stroke-width="26"/>
  <ellipse cx="210" cy="168" rx="62" ry="52" fill="none" stroke="#FF6A1A" stroke-width="20"/>
