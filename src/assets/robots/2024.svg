<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" role="img" aria-label="Illustration of OHMER-24, the 2024 robot">
  <style>
    .r-o{stroke:#0B0E0C;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
    .r-al{fill:#C9CFD3}.r-al2{fill:#9AA3A9}.r-dk{fill:#2B312D}
  </style>
  <ellipse cx="210" cy="334" rx="170" ry="10" fill="#000" opacity=".35"/>
  <!-- climber post -->
  <rect class="r-o r-al" x="200" y="34" width="20" height="150"/>
  <path class="r-o" d="M196 40h28v-14h-10" fill="none"/>
  <circle class="r-o" cx="210" cy="30" r="8" fill="#FF8A3D"/>
