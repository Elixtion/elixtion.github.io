  <circle cx="176" cy="229" r="4" fill="#E2363E"/><circle cx="194" cy="229" r="4" fill="#E2363E"/><circle cx="212" cy="229" r="4" fill="#E2363E"/><circle cx="230" cy="229" r="4" fill="#E2363E"/><circle cx="248" cy="229" r="4" fill="#E2363E"/>
  <!-- chassis -->
  <rect class="r-o r-al" x="70" y="236" width="280" height="24" rx="2"/>
