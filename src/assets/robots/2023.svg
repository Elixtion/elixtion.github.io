<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" role="img" aria-label="Illustration of the 2023 robot">
  <style>
    .r-o{stroke:#0B0E0C;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
    .r-al{fill:#C9CFD3}.r-al2{fill:#9AA3A9}.r-dk{fill:#2B312D}
  </style>
  <ellipse cx="210" cy="334" rx="170" ry="10" fill="#000" opacity=".35"/>
  <!-- rear tower -->
  <path class="r-o r-al" d="M92 238 L112 120 L132 120 L130 238 Z"/>
  <!-- chassis + electronics -->
  <rect class="r-o r-dk" x="78" y="226" width="264" height="34" rx="4"/>
  <rect class="r-o" x="150" y="214" width="22" height="18" rx="3" fill="#1A1E1C"/>
  <rect class="r-o" x="178" y="214" width="22" height="18" rx="3" fill="#1A1E1C"/>
  <!-- diagonal telescoping arm -->
  <path class="r-o r-al" d="M100 232 L304 64 L322 84 L122 248 Z"/>
  <path class="r-o r-al2" d="M170 178 L318 58 L330 72 L184 192 Z"/>
  <path d="M138 204 L150 216M170 178 L184 192M206 148 L220 162M244 118 L256 130" stroke="#0B0E0C" stroke-width="2"/>
  <!-- pivot -->
  <circle class="r-o r-al2" cx="118" cy="228" r="14"/><circle cx="118" cy="228" r="4" fill="#0B0E0C"/>
  <!-- gripper -->
  <path class="r-o r-dk" d="M318 48 L352 52 L350 66 L330 66 L338 92 L324 94 L312 62 Z"/>
  <!-- the cone -->
  <path class="r-o" d="M352 40 L376 118 L328 118 Z" fill="#FFCD00"/>
  <rect class="r-o" x="322" y="116" width="60" height="10" rx="2" fill="#FFCD00"/>
  <!-- cube waiting on the floor -->
  <rect class="r-o" x="30" y="262" width="0" height="0" fill="none"/>
  <!-- bumpers -->
  <rect class="r-o" x="56" y="256" width="308" height="68" rx="12" fill="#2D5BD0"/>
  <path d="M68 266h284" stroke="#5C82E6" stroke-width="4" stroke-linecap="round"/>
  <text x="210" y="308" text-anchor="middle" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="800" font-size="44" fill="#FFFFFF" letter-spacing="2">86</text>
</svg>
