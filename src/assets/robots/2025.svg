<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" role="img" aria-label="Illustration of OHMER, the 2025 robot">
  <style>
    .r-o{stroke:#0B0E0C;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
    .r-al{fill:#C9CFD3}.r-al2{fill:#9AA3A9}.r-dk{fill:#2B312D}
  </style>
  <ellipse cx="210" cy="334" rx="160" ry="10" fill="#000" opacity=".35"/>
  <!-- electronics deck -->
  <rect class="r-o r-dk" x="82" y="218" width="256" height="44" rx="4"/>
  <g class="r-o">
    <rect x="96" y="204" width="20" height="30" rx="4" fill="#1A1E1C"/><rect x="96" y="200" width="20" height="8" rx="3" fill="#64F426"/>
    <rect x="122" y="204" width="20" height="30" rx="4" fill="#1A1E1C"/><rect x="122" y="200" width="20" height="8" rx="3" fill="#64F426"/>
    <rect x="296" y="204" width="20" height="30" rx="4" fill="#1A1E1C"/><rect x="296" y="200" width="20" height="8" rx="3" fill="#64F426"/>
  </g>
  <rect class="r-o r-al" x="150" y="226" width="60" height="22" rx="3"/>
  <path d="M220 236c10-8 20 8 30 0s20 8 30 0" stroke="#FF5A4E" stroke-width="3" fill="none"/>
  <!-- elevator: outer stage -->
  <g class="r-o r-al">
    <rect x="164" y="64" width="18" height="174"/>
    <rect x="238" y="64" width="18" height="174"/>
    <rect x="164" y="150" width="92" height="12"/>
  </g>
  <!-- inner stage -->
  <g class="r-o r-al2">
    <rect x="186" y="40" width="12" height="150"/>
    <rect x="222" y="40" width="12" height="150"/>
  </g>
  <!-- drag chain -->
  <rect class="r-o" x="262" y="58" width="14" height="176" rx="4" fill="#1A1E1C"/>
  <path d="M262 74h14M262 90h14M262 106h14M262 122h14M262 138h14M262 154h14M262 170h14M262 186h14M262 202h14M262 218h14" stroke="#4A524D" stroke-width="2"/>
  <!-- carriage + end effector -->
  <rect class="r-o r-al" x="150" y="28" width="120" height="28" rx="3"/>
  <rect class="r-o r-al2" x="112" y="52" width="196" height="14" rx="4"/>
  <circle class="r-o r-dk" cx="124" cy="59" r="9"/><circle class="r-o r-dk" cx="296" cy="59" r="9"/>
  <rect class="r-o" x="176" y="34" width="68" height="14" rx="2" fill="#FFFFFF"/>
  <!-- status light -->
  <circle cx="256" cy="22" r="14" fill="#FF8A3D" opacity=".35"/>
  <circle class="r-o" cx="256" cy="22" r="7" fill="#FF8A3D"/>
  <!-- bumpers -->
  <rect class="r-o" x="56" y="258" width="308" height="66" rx="12" fill="#C8343C"/>
  <path d="M68 268h284" stroke="#E2636A" stroke-width="4" stroke-linecap="round"/>
  <text x="210" y="309" text-anchor="middle" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="800" font-size="44" fill="#FFFFFF" letter-spacing="2">86</text>
</svg>
