<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Sign In — CrowdScout</title>
  <meta name="theme-color" content="#111312"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="lib/supabase-client.js"></script>
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px">

<div style="width:100%;max-width:400px">

  <div style="text-align:center;margin-bottom:28px">
    <a href="landing.html">
      <img src="https://raw.githubusercontent.com/Elixtion/elixtion.github.io/refs/heads/main/images/Untitled%20design%20(3).png"
           alt="CrowdScout" style="height:52px;width:52px;border-radius:12px;margin-bottom:12px"/>
    </a>
    <h1 style="font-size:1.4rem;font-weight:800;margin:0 0 4px">Sign In to CrowdScout</h1>
    <p style="color:var(--surface-500);font-size:0.875rem;margin:0">Scout smarter with crowd-sourced data</p>
  </div>

  <div class="cs-card">
    <div class="cs-field">
      <label class="cs-label">Email</label>
      <input id="email" type="email" class="cs-input" placeholder="you@example.com" autocomplete="email"/>
    </div>
    <div class="cs-field">
      <label class="cs-label">Password</label>
      <input id="password" type="password" class="cs-input" placeholder="••••••••"
             autocomplete="current-password" onkeydown="if(event.key==='Enter')handleSignIn()"/>
    </div>
    <div id="errMsg" style="font-size:0.8rem;color:#f87171;margin-bottom:8px;display:none"></div>
    <div id="resendRow" style="display:none;margin-bottom:8px">
      <button onclick="resendConfirmation()" id="resendBtn"
              style="background:none;border:none;color:var(--primary-500);cursor:pointer;font-weight:600;padding:0;font-size:0.8rem">
        Resend confirmation email
      </button>
    </div>
    <button class="cs-btn cs-btn-primary" style="width:100%;margin-bottom:10px" id="signInBtn" onclick="handleSignIn()">
      Sign In
    </button>

    <div style="text-align:center;margin-bottom:10px">
      <a href="forgot-password.html" style="font-size:0.8rem;color:var(--primary-400)">Forgot password?</a>
    </div>

    <div style="text-align:center;font-size:0.8rem;color:var(--surface-500);border-top:1px solid var(--surface-100);padding-top:12px">
      No account?
      <a href="signup.html" style="color:var(--primary-500);font-weight:600;text-decoration:none">Create one</a>
    </div>
  </div>

  <div style="text-align:center;margin-top:16px">
    <a href="landing.html" style="font-size:0.8rem;color:var(--surface-400)">← Back to home</a>
  </div>

</div>

<div id="cs-toast-container"></div>

<script>
// If already logged in, skip to home
(async function init() {
  const session = await window.CS?.auth?.getSession?.();
  if (session) { window.location.href = "home.html"; return; }
})();

async function handleSignIn() {
  const email    = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  if (!email || !password) { showErr("Enter your email and password."); return; }

  const btn = document.getElementById("signInBtn");
  btn.disabled = true;
  btn.textContent = "Please wait…";
  document.getElementById("errMsg").style.display = "none";
  document.getElementById("resendRow").style.display = "none";

  const result = await window.CS.auth.signIn(email, password);

  btn.disabled = false;
  btn.textContent = "Sign In";

  if (result.error) {
    showErr(window.CS.auth.friendlyError(result.error.message));
    // Offer resend if the account exists but is unconfirmed
    if ((result.error.message || "").toLowerCase().includes("not confirmed")) {
      document.getElementById("resendRow").style.display = "";
    }
    return;
  }
  window.location.href = "home.html";
}

async function resendConfirmation() {
  const email = document.getElementById("email").value.trim();
  if (!email) { showErr("Enter your email above first."); return; }
  const btn = document.getElementById("resendBtn");
  btn.disabled = true;
  btn.textContent = "Sending…";
  const { error } = await window.CS.auth.resendConfirmation(email);
  btn.disabled = false;
  if (error) {
    btn.textContent = "Resend confirmation email";
    showErr(window.CS.auth.friendlyError(error.message));
  } else {
    btn.textContent = "Sent! Check your inbox.";
    showErr("Confirmation email sent. Check your inbox and spam folder.", "info");
  }
}

function showErr(msg, type = "error") {
  const el = document.getElementById("errMsg");
  el.textContent = msg;
  el.style.color = type === "info" ? "var(--primary-400)" : "#f87171";
  el.style.display = "";
}
</script>
</body>
</html>
