<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Signing in… — CrowdScout</title>
  <meta name="theme-color" content="#111312"/>
  <link rel="stylesheet" href="styles.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="lib/supabase-client.js"></script>
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:16px;text-align:center;padding:20px">

  <img src="https://raw.githubusercontent.com/Elixtion/elixtion.github.io/refs/heads/main/images/Untitled%20design%20(3).png"
       alt="CrowdScout" style="height:52px;width:52px;border-radius:12px;margin-bottom:4px"/>
  <div style="font-size:1.1rem;font-weight:700" id="statusMsg">Signing you in…</div>
  <div style="color:var(--surface-500);font-size:0.875rem" id="subMsg">Just a moment.</div>

  <!-- Spinner -->
  <div style="width:32px;height:32px;border:3px solid var(--surface-200);border-top-color:var(--primary-500);border-radius:50%;animation:spin .8s linear infinite" id="spinner"></div>
  <style>@keyframes spin { to { transform:rotate(360deg); } }</style>

  <div id="actionRow" style="display:none;flex-direction:column;gap:10px;width:100%;max-width:300px"></div>

<script>
(async function handleCallback() {
  const hashParams  = new URLSearchParams(window.location.hash.replace(/^#/, ""));
  const queryParams = new URLSearchParams(window.location.search);

  // ── 1. Error from Supabase (expired / already-used link) ────────────────
  const errDesc = hashParams.get("error_description") || queryParams.get("error_description");
  const errCode = hashParams.get("error_code") || queryParams.get("error_code");
  if (errDesc || errCode) {
    fail(
      "Link expired or invalid",
      window.CS.auth.friendlyError(errDesc || errCode),
      [
        { label: "Resend from Sign Up", href: "signup.html" },
        { label: "Back to Sign In", href: "login.html" },
      ]
    );
    return;
  }

  // ── 2. Password recovery links belong on the reset page ─────────────────
  const type = hashParams.get("type") || queryParams.get("type");
  if (type === "recovery") {
    // Preserve the hash so the reset page can establish the session
    window.location.replace("reset-password.html" + window.location.search + window.location.hash);
    return;
  }

  // ── 3. Normal confirmation / magic-link: wait for the session ───────────
  let attempts = 0;
  const MAX = 20; // 10 seconds

  async function check() {
    attempts++;
    const session = await window.CS?.auth?.getSession?.();

    if (session) {
      document.getElementById("statusMsg").textContent = "Signed in!";
      document.getElementById("subMsg").textContent = "Redirecting…";
      document.getElementById("spinner").style.display = "none";

      const profile = await window.CS.profile.get(session.user.id);
      window.location.href = window.CS.profile.isComplete(profile) ? "home.html" : "profile-setup.html";
      return;
    }

    if (attempts >= MAX) {
      fail(
        "Sign-in failed",
        "Could not establish a session. Your link may have expired.",
        [{ label: "Try signing in", href: "login.html" }]
      );
      return;
    }

    setTimeout(check, 500);
  }

  // Give Supabase 300ms to process the URL hash before polling
  setTimeout(check, 300);
})();

function fail(title, msg, actions) {
  document.getElementById("statusMsg").textContent = title;
  document.getElementById("subMsg").textContent = msg;
  document.getElementById("spinner").style.display = "none";
  const row = document.getElementById("actionRow");
  row.style.display = "flex";
  row.innerHTML = actions.map(a =>
    `<a href="${a.href}" class="cs-btn cs-btn-secondary" style="text-decoration:none">${a.label}</a>`
  ).join("");
}
</script>
</body>
</html>
