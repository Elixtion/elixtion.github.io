<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Set New Password — CrowdScout</title>
  <meta name="theme-color" content="#111312"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="lib/supabase-client.js"></script>
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px">

<div style="width:100%;max-width:400px">

  <div style="text-align:center;margin-bottom:28px">
    <img src="https://raw.githubusercontent.com/Elixtion/elixtion.github.io/refs/heads/main/images/Untitled%20design%20(3).png"
         alt="CrowdScout" style="height:52px;width:52px;border-radius:12px;margin-bottom:12px"/>
    <h1 style="font-size:1.4rem;font-weight:800;margin:0 0 4px">Set a New Password</h1>
    <p style="color:var(--surface-500);font-size:0.875rem;margin:0" id="subTitle">Verifying your reset link…</p>
  </div>

  <!-- Waiting for session from the recovery link -->
  <div class="cs-card" id="waitPane" style="text-align:center;padding:28px">
    <div style="width:32px;height:32px;margin:0 auto 12px;border:3px solid var(--surface-200);border-top-color:var(--primary-500);border-radius:50%;animation:spin .8s linear infinite"></div>
    <div style="font-size:0.85rem;color:var(--surface-500)">Checking your link…</div>
  </div>
  <style>@keyframes spin { to { transform:rotate(360deg); } }</style>

  <!-- Invalid / expired link -->
  <div class="cs-card" id="badPane" style="display:none;text-align:center">
    <span class="material-symbols-outlined" style="font-size:44px;color:#f87171;display:block;margin-bottom:10px">link_off</span>
    <div style="font-weight:700;font-size:1.05rem;margin-bottom:6px">Link expired or invalid</div>
    <p style="font-size:0.85rem;color:var(--surface-500);margin:0 0 14px" id="badMsg">
      This password reset link has expired or was already used.
    </p>
    <a href="forgot-password.html" class="cs-btn cs-btn-primary" style="width:100%;text-decoration:none">Request a New Link</a>
  </div>

  <!-- New password form -->
  <div class="cs-card" id="formPane" style="display:none">
    <div class="cs-field">
      <label class="cs-label">New Password</label>
      <input id="password" type="password" class="cs-input" placeholder="At least 6 characters" autocomplete="new-password"/>
    </div>
    <div class="cs-field">
      <label class="cs-label">Confirm New Password</label>
      <input id="password2" type="password" class="cs-input" placeholder="Repeat your new password"
             autocomplete="new-password" onkeydown="if(event.key==='Enter')handleUpdate()"/>
    </div>
    <div id="errMsg" style="font-size:0.8rem;color:#f87171;margin-bottom:8px;display:none"></div>
    <button class="cs-btn cs-btn-primary" style="width:100%" id="updateBtn" onclick="handleUpdate()">
      Update Password
    </button>
  </div>

  <!-- Done -->
  <div class="cs-card" id="donePane" style="display:none;text-align:center">
    <span class="material-symbols-outlined" style="font-size:44px;color:var(--primary-500);display:block;margin-bottom:10px">check_circle</span>
    <div style="font-weight:700;font-size:1.05rem;margin-bottom:6px">Password updated</div>
    <p style="font-size:0.85rem;color:var(--surface-500);margin:0 0 14px">You're signed in. Redirecting…</p>
    <a href="home.html" class="cs-btn cs-btn-primary" style="width:100%;text-decoration:none">Go to Dashboard</a>
  </div>

</div>

<div id="cs-toast-container"></div>

<script>
function show(pane) {
  ["waitPane","badPane","formPane","donePane"].forEach(id => {
    document.getElementById(id).style.display = id === pane ? "" : "none";
  });
  document.getElementById("subTitle").textContent = {
    waitPane: "Verifying your reset link…",
    badPane:  "Something's wrong with this link.",
    formPane: "Choose a new password for your account.",
    donePane: "All set!",
  }[pane];
}

(function init() {
  // Supabase appends errors to the hash/query when a link is expired or reused
  const hashParams  = new URLSearchParams(window.location.hash.replace(/^#/, ""));
  const queryParams = new URLSearchParams(window.location.search);
  const errDesc = hashParams.get("error_description") || queryParams.get("error_description");
  if (errDesc) {
    document.getElementById("badMsg").textContent = window.CS.auth.friendlyError(errDesc);
    show("badPane");
    return;
  }

  // The recovery link signs the user in via the URL hash; the client picks it
  // up asynchronously, so listen for the event AND poll as a fallback.
  let resolved = false;
  window.CS.auth.onAuthStateChange((event, session) => {
    if (resolved) return;
    if (event === "PASSWORD_RECOVERY" || (event === "SIGNED_IN" && session)) {
      resolved = true;
      show("formPane");
    }
  });

  let attempts = 0;
  (async function poll() {
    if (resolved) return;
    const session = await window.CS.auth.getSession();
    if (session) { resolved = true; show("formPane"); return; }
    if (++attempts >= 16) { show("badPane"); return; } // ~8s
    setTimeout(poll, 500);
  })();
})();

async function handleUpdate() {
  const p1 = document.getElementById("password").value;
  const p2 = document.getElementById("password2").value;
  if (p1.length < 6) { showErr("Password must be at least 6 characters."); return; }
  if (p1 !== p2) { showErr("Passwords don't match."); return; }

  const btn = document.getElementById("updateBtn");
  btn.disabled = true;
  btn.textContent = "Updating…";
  document.getElementById("errMsg").style.display = "none";

  const { error } = await window.CS.auth.updatePassword(p1);

  btn.disabled = false;
  btn.textContent = "Update Password";

  if (error) { showErr(window.CS.auth.friendlyError(error.message)); return; }

  show("donePane");
  setTimeout(() => { window.location.href = "home.html"; }, 1500);
}

function showErr(msg) {
  const el = document.getElementById("errMsg");
  el.textContent = msg;
  el.style.display = "";
}
</script>
</body>
</html>
